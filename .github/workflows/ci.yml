name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-go:
    name: Security / Go vulnerability
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore pinned security tools
        id: security-tools-cache
        uses: actions/cache/restore@v5
        with:
          path: .bin/security-tools
          key: security-tools-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-manifest-${{ hashFiles('.security/security-tools.versions') }}-installer-${{ hashFiles('scripts/security-tools.sh') }}

      - name: Verify pinned security tools
        run: make security-tools

      - name: Run Go vulnerability and security gates
        env:
          SECURITY_EVIDENCE_DIR: artifacts/security/go-security
        run: make security-go

      - name: Upload scanner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-go-evidence
          path: artifacts/security/go-security/
          if-no-files-found: error

      # Pull-request caches are scoped to refs/pull/.../merge, so they can warm a
      # rerun without being restorable by main or another pull request. This save
      # is owned by one child to avoid concurrent writes to the same exact key.
      - name: Save pinned security tools
        if: success() && steps.security-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .bin/security-tools
          key: ${{ steps.security-tools-cache.outputs.cache-primary-key }}

  security-static:
    name: Security / Go static
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore pinned security tools
        id: security-tools-cache
        uses: actions/cache/restore@v5
        with:
          path: .bin/security-tools
          key: security-tools-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-manifest-${{ hashFiles('.security/security-tools.versions') }}-installer-${{ hashFiles('scripts/security-tools.sh') }}

      - name: Verify pinned security tools
        run: make security-tools

      - name: Run Go static quality gate
        env:
          SECURITY_EVIDENCE_DIR: artifacts/security/go-static
        run: make security-static

      - name: Upload scanner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-static-evidence
          path: artifacts/security/go-static/
          if-no-files-found: error

  security-policy:
    name: Security / Repository policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore pinned security tools
        id: security-tools-cache
        uses: actions/cache/restore@v5
        with:
          path: .bin/security-tools
          key: security-tools-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-manifest-${{ hashFiles('.security/security-tools.versions') }}-installer-${{ hashFiles('scripts/security-tools.sh') }}

      - name: Verify pinned security tools
        run: make security-tools

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi

      - name: Run repository policy gates
        env:
          SECURITY_EVIDENCE_DIR: artifacts/security/repository-policy
          SECURITY_GITLEAKS_HISTORY_MODE: ${{ github.event_name == 'pull_request' && 'range' || 'full' }}
          SECURITY_GITLEAKS_BASE: ${{ github.event.pull_request.base.sha }}
          SECURITY_GITLEAKS_HEAD: ${{ github.event.pull_request.head.sha }}
        run: make security-policy

      - name: Upload scanner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-policy-evidence
          path: artifacts/security/repository-policy/
          if-no-files-found: error

  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test

  darwin-native:
    name: Darwin Native Key Adapter
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile and test native key adapter
        env:
          CGO_ENABLED: "1"
        run: |
          go test ./internal/platformkeys
          go build ./cmd/projmux

  npm-pack:
    name: NPM Packages
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect package relevance
        id: package-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          needed=0
          reason="no package-related files changed"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            case "$PR_TITLE" in
              "chore(main): release "*)
                needed=1
                reason="release PR"
                ;;
            esac
            git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" > changed-files.txt
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            : > changed-files.txt
            reason="scheduled workflow; package inputs unchanged"
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-only -r "$PUSH_SHA" > changed-files.txt
          else
            git diff --name-only "$PUSH_BEFORE" "$PUSH_SHA" > changed-files.txt
          fi

          if [[ "$needed" != "1" ]] && grep -Eq '^(package(-lock)?\.json|npm/|scripts/package-npm\.sh|README(\.md|-ko\.md)?|LICENSE|docs/|\.github/workflows/release(-please)?\.yml)' changed-files.txt; then
            needed=1
            reason="package-related files changed"
          fi

          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "NPM package check: $reason"

      - name: Set up Go
        if: steps.package-scope.outputs.needed == '1'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        if: steps.package-scope.outputs.needed == '1'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate npm package staging
        if: steps.package-scope.outputs.needed == '1'
        run: make npm-pack

      - name: Verify npm Darwin native key adapters
        if: steps.package-scope.outputs.needed == '1'
        run: |
          otool -L dist/npm/@projmux/darwin-x64/bin/projmux | grep -F ApplicationServices.framework
          otool -L dist/npm/@projmux/darwin-arm64/bin/projmux | grep -F ApplicationServices.framework

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run integration tests
        run: make test-integration

  # One shard per runner. The four Linux fixtures are mutually isolated by
  # container, HOME/XDG, and tmux socket, but a single runner still made them
  # share one CPU budget; the real-tmux waits inside them are load-sensitive.
  # Splitting the schedule unit to match the isolation unit is the point.
  #
  # Every matrix leg uploads under its own artifact name. One name shared across
  # legs would have them overwrite each other's evidence, which is the failure
  # the upload exists to prevent.
  e2e-linux:
    name: E2E Linux ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Observed steady-state is about four minutes. The default six-hour job
    # ceiling turns one wedged container into a burned runner slot with no
    # evidence, so bound it well above the real distribution instead.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard:
          - fixture-1
          - fixture-2
          - fixture-3
          - fixture-4

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run e2e Linux shard
        env:
          PROJMUX_E2E_LINUX_SHARD: ${{ matrix.shard }}
        run: make test-e2e

      # The attempt directory dies with the runner, which is why a failing e2e
      # run leaves nothing to read but the log. Preserve the evidence subtree and
      # skip binary/: it is 99.8% of the attempt size and is reproducible from the
      # commit plus the binary_sha256 already recorded in build.json.
      - name: Preserve failing attempt evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-failure-${{ github.run_id }}-${{ github.run_attempt }}-linux-${{ matrix.shard }}
          path: |
            .bin/e2e-evidence/attempt-*/**
            !.bin/e2e-evidence/attempt-*/binary/**
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve passing attempt evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-success-${{ github.run_id }}-${{ github.run_attempt }}-linux-${{ matrix.shard }}
          path: |
            .bin/e2e-evidence/attempt-*/**
            !.bin/e2e-evidence/attempt-*/binary/**
          if-no-files-found: warn
          retention-days: 1

  e2e-suite:
    name: E2E ${{ matrix.suite }}
    runs-on: ubuntu-latest
    # Observed steady-state is about four minutes. The default six-hour job
    # ceiling turns one wedged container into a burned runner slot with no
    # evidence, so bound it well above the real distribution instead.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        suite:
          - codex-lifecycle
          - npm-staging

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run e2e suite
        env:
          PROJMUX_E2E_SUITE: ${{ matrix.suite }}
        run: make test-e2e

      # The attempt directory dies with the runner, which is why a failing e2e
      # run leaves nothing to read but the log. Preserve the evidence subtree and
      # skip binary/: it is 99.8% of the attempt size and is reproducible from the
      # commit plus the binary_sha256 already recorded in build.json.
      - name: Preserve failing attempt evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
          path: |
            .bin/e2e-evidence/attempt-*/**
            !.bin/e2e-evidence/attempt-*/binary/**
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve passing attempt evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-success-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
          path: |
            .bin/e2e-evidence/attempt-*/**
            !.bin/e2e-evidence/attempt-*/binary/**
          if-no-files-found: warn
          retention-days: 1

  # The `main-protect` ruleset requires a status check named exactly
  # "E2E Tests". A context that is never reported stays pending forever instead
  # of failing, so renaming or dropping this job would deadlock every merge
  # rather than surface an error. Changing the ruleset needs repository admin,
  # so the name stays here and this job carries it over the split shards.
  e2e-tests:
    name: E2E Tests
    if: always()
    needs:
      - e2e-linux
      - e2e-suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout aggregate policy
        uses: actions/checkout@v6

      - name: Require every e2e child to succeed
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/required-gate.py \
            --results-json "$REQUIRED_RESULTS" \
            --required e2e-linux \
            --required e2e-suite

  test:
    name: Test
    if: always()
    needs:
      - security-go
      - security-static
      - security-policy
      - fmt
      - unit
      - darwin-native
      - npm-pack
      - integration
      - e2e-linux
      - e2e-suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout aggregate policy
        uses: actions/checkout@v6

      - name: Require every child to succeed
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/required-gate.py \
            --results-json "$REQUIRED_RESULTS" \
            --required security-go \
            --required security-static \
            --required security-policy \
            --required fmt \
            --required unit \
            --required darwin-native \
            --required npm-pack \
            --required integration \
            --required e2e-linux \
            --required e2e-suite
