name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore pinned security tools
        id: security-tools-cache
        uses: actions/cache/restore@v5
        with:
          path: .bin/security-tools
          key: security-tools-${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('go.mod') }}-manifest-${{ hashFiles('.security/security-tools.versions') }}

      - name: Verify pinned security tools
        run: make security-tools

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi

      - name: Run security gates
        run: make security

      # Pull-request caches are scoped to refs/pull/.../merge, so they can warm a
      # rerun without being restorable by main or another pull request. This save
      # remains after every security gate and only runs for an exact-key miss.
      - name: Save pinned security tools
        if: success() && steps.security-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .bin/security-tools
          key: ${{ steps.security-tools-cache.outputs.cache-primary-key }}

  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test

  darwin-native:
    name: Darwin Native Key Adapter
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile and test native key adapter
        env:
          CGO_ENABLED: "1"
        run: |
          go test ./internal/platformkeys
          go build ./cmd/projmux

  npm-pack:
    name: NPM Packages
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect package relevance
        id: package-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          needed=0
          reason="no package-related files changed"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            case "$PR_TITLE" in
              "chore(main): release "*)
                needed=1
                reason="release PR"
                ;;
            esac
            git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" > changed-files.txt
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-only -r "$PUSH_SHA" > changed-files.txt
          else
            git diff --name-only "$PUSH_BEFORE" "$PUSH_SHA" > changed-files.txt
          fi

          if [[ "$needed" != "1" ]] && grep -Eq '^(package(-lock)?\.json|npm/|scripts/package-npm\.sh|README(\.md|-ko\.md)?|LICENSE|docs/|\.github/workflows/release(-please)?\.yml)' changed-files.txt; then
            needed=1
            reason="package-related files changed"
          fi

          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "NPM package check: $reason"

      - name: Set up Go
        if: steps.package-scope.outputs.needed == '1'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        if: steps.package-scope.outputs.needed == '1'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate npm package staging
        if: steps.package-scope.outputs.needed == '1'
        run: make npm-pack

      - name: Verify npm Darwin native key adapters
        if: steps.package-scope.outputs.needed == '1'
        run: |
          otool -L dist/npm/@projmux/darwin-x64/bin/projmux | grep -F ApplicationServices.framework
          otool -L dist/npm/@projmux/darwin-arm64/bin/projmux | grep -F ApplicationServices.framework

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run integration tests
        run: make test-integration

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run e2e tests
        run: make test-e2e
