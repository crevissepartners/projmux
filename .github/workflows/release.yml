name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  fmt:
    name: Release Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

  unit:
    name: Release Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test

  integration:
    name: Release Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run integration tests
        run: make test-integration

  e2e-linux:
    name: Release E2E Linux ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard:
          - fixture-1
          - fixture-2
          - fixture-3
          - fixture-4

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run e2e Linux shard
        env:
          PROJMUX_E2E_LINUX_SHARD: ${{ matrix.shard }}
        run: make test-e2e

      - name: Preserve failing attempt evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-evidence-failure-${{ github.run_id }}-${{ github.run_attempt }}-linux-${{ matrix.shard }}
          path: |
            .bin/e2e-evidence/attempt-*/**
            !.bin/e2e-evidence/attempt-*/binary/**
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve passing attempt evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-evidence-success-${{ github.run_id }}-${{ github.run_attempt }}-linux-${{ matrix.shard }}
          path: |
            .bin/e2e-evidence/attempt-*/**
            !.bin/e2e-evidence/attempt-*/binary/**
          if-no-files-found: warn
          retention-days: 1

  e2e-suite:
    name: Release E2E ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        suite:
          - codex-lifecycle
          - npm-staging

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run e2e suite
        env:
          PROJMUX_E2E_SUITE: ${{ matrix.suite }}
        run: make test-e2e

      - name: Preserve failing attempt evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-evidence-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
          path: |
            .bin/e2e-evidence/attempt-*/**
            !.bin/e2e-evidence/attempt-*/binary/**
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve passing attempt evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-evidence-success-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
          path: |
            .bin/e2e-evidence/attempt-*/**
            !.bin/e2e-evidence/attempt-*/binary/**
          if-no-files-found: warn
          retention-days: 1

  e2e:
    name: Release E2E Tests
    if: always()
    needs:
      - e2e-linux
      - e2e-suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout aggregate policy
        uses: actions/checkout@v6

      - name: Require every release e2e child to succeed
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/required-gate.py \
            --results-json "$REQUIRED_RESULTS" \
            --required e2e-linux \
            --required e2e-suite

  release:
    name: Build Release
    needs:
      - fmt
      - unit
      - integration
      - e2e
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            cgo: "0"
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cgo: "0"
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            cgo: "1"
          - goos: darwin
            goarch: arm64
            runner: macos-15
            cgo: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="projmux_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/crevissepartners/projmux/internal/version.current=${version}" \
            -o "dist/${name}/projmux" ./cmd/projmux
          cp README.md README-ko.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: projmux-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  publish:
    name: Publish Artifacts
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz --clobber

  publish-npm:
    name: Publish npm Packages
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download release binaries
        uses: actions/download-artifact@v7
        with:
          path: dist/release
          merge-multiple: true

      - name: Stage npm packages
        run: scripts/package-npm.sh --version "${GITHUB_REF_NAME#v}" --out dist/npm --release-dir dist/release

      - name: Publish npm packages
        run: |
          set -euo pipefail
          # npm moves `dist-tags.latest` onto whatever it publishes unless
          # `--tag` says otherwise -- a semver prerelease version is not
          # enough on its own. A prerelease tag therefore has to name its own
          # channel, or every `npm install projmux` would land on the rc.
          npm_tag=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            npm_tag=(--tag rc)
          fi
          for dir in \
            dist/npm/@projmux/linux-x64 \
            dist/npm/@projmux/linux-arm64 \
            dist/npm/@projmux/darwin-x64 \
            dist/npm/@projmux/darwin-arm64 \
            dist/npm/projmux; do
            npm publish "$dir" --access public "${npm_tag[@]}"
          done

  publish-release:
    name: Publish GitHub Release
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # release-please drafts the release, so it is invisible to users until
      # this step. Gating it on `publish-npm` is what keeps the GitHub release
      # and the npm `dist-tags.latest` from drifting apart: a failed npm
      # publish leaves the release drafted and fails the workflow instead of
      # advertising a version npm cannot install yet.
      - name: Publish the drafted release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Undrafting must not clear the prerelease flag: `releases/latest`
          # excludes prereleases by definition, and that exclusion is what
          # hides an rc from the default channel.
          release_edit=(--draft=false)
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            release_edit+=(--prerelease)
          fi
          gh release edit "${GITHUB_REF_NAME}" "${release_edit[@]}"
